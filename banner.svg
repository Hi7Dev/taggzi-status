<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1712"/><stop offset="1" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#F0BF4A"/><stop offset="1" stop-color="#c6a85b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0BF4A" stop-opacity=".22"/><stop offset="1" stop-color="#F0BF4A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="22" fill="url(#glow)"/>
  <!-- radar rings -->
  <g transform="translate(985 130)" fill="none" stroke="#F0BF4A">
    <circle r="28" stroke-opacity=".9" stroke-width="3"/>
    <circle r="28" stroke-width="2"><animate attributeName="r" values="28;110" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="28" stroke-width="2"><animate attributeName="r" values="28;110" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle r="28" stroke-width="2"><animate attributeName="r" values="28;110" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle r="12" fill="#22c55e" stroke="none"><animate attributeName="opacity" values="1;.5;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="64" y="112" font-size="54" font-weight="800" fill="#F2EDE8">Taggzi <tspan fill="url(#gold)">Status</tspan></text>
  <text x="66" y="156" font-size="21" fill="#9C968C">Live health of the Taggzi pet ID platform — checked every 5 minutes</text>
  <rect x="64" y="186" width="250" height="4" rx="2" fill="url(#gold)">
    <animate attributeName="width" values="0;250" dur="1.2s" fill="freeze"/>
  </rect>
</svg>
